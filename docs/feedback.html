<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feedback — Nostos</title>
<style>body{font-family:IBM Plex Sans,sans-serif;background:#F8F1E0;color:#2B2118;padding:2rem;margin:0;min-height:100vh} .card{max-width:480px;margin:auto;background:#FCF7E8;border:1px solid #A38B5C;border-radius:16px;padding:1.5rem;text-align:center} h1{font-size:1.4rem;margin:0 0 1rem} .stars{display:flex;justify-content:center;gap:.35rem} .stars button{font-size:1.6rem;background:none;border:none;cursor:pointer;color:#D8CBA8;padding:.2rem;transition:transform .12s ease,color .12s ease} .stars button:hover{transform:scale(1.15)} .stars button.active{color:#D9A44A} #comment{width:100%;margin-top:1rem;min-height:80px;font-family:inherit;font-size:.95rem;padding:.6rem .75rem;border:1.5px solid #A38B5C;border-radius:8px;background:#FCF9EF;box-sizing:border-box;resize:vertical} #comment:focus{outline:none;border-color:#D9A44A;box-shadow:0 0 0 3px rgba(217,164,74,.25)} #send{margin-top:1rem;padding:.6rem 1.4rem;border-radius:999px;background:#A84E28;color:#F8F1E0;border:none;font-weight:600;font-size:.9rem;cursor:pointer;transition:filter .15s ease,transform .15s ease} #send:hover{filter:brightness(1.05);transform:translateY(-1px)} #msg{margin-top:1rem;font-size:.9rem} #msg[hidden]{display:none}</style>
</head><body><div class="card">
<h1>Com'è andata?</h1><div class="stars" id="stars"><button data-r="1">★</button><button data-r="2">★</button><button data-r="3">★</button><button data-r="4">★</button><button data-r="5">★</button></div>
<textarea id="comment" placeholder="Un commento (facoltativo)"></textarea>
<button id="send">Invia feedback</button>
<p id="msg" hidden></p></div>
<script>
const API_BASE="https://nostos.xen-ia.org/api/v1";
const params=new URLSearchParams(location.search); const tripId=params.get("trip_id"), token=params.get("token");
let rating=0;
const msgEl=document.getElementById("msg");
document.querySelectorAll("#stars button").forEach(b=>b.onclick=()=>{rating=+b.dataset.r; document.querySelectorAll("#stars button").forEach(x=>x.classList.toggle("active",+x.dataset.r<=rating))});
document.getElementById("send").onclick=async()=>{
  if(!tripId){ msgEl.hidden=false; msgEl.textContent="Errore: trip_id mancante"; return; }
  if(!rating){ msgEl.hidden=false; msgEl.textContent="Scegli un voto"; return; }
  const headers={"Content-Type":"application/json"}; if(token) headers["X-Feedback-Token"]=token;
  const res=await fetch(`${API_BASE}/trips/${tripId}/feedback/public`,{method:"POST",headers,body:JSON.stringify({rating, comment: document.getElementById("comment").value||null})});
  msgEl.hidden=false;
  msgEl.textContent=res.ok?"Grazie del feedback!":"Errore: "+res.status;
};
</script></body></html>
