<!DOCTYPE html>
<html lang="it" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Nostos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
    table { border-collapse: collapse; }
    table.card-frame, table.cta-frame, table.hairline-frame { border-collapse: separate !important; border-spacing: 0; }
    a { text-decoration: none; }

    @media (prefers-color-scheme: dark) {
      .d-body    { background-color: #04070A !important; }
      .d-shell   { background-color: #070E14 !important; border-color: #16232F !important; }
      .d-lead    { color: #F0EBDD !important; }
      .d-bodytext{ color: #F0EBDD !important; }
      .d-muted   { color: #A9B7C4 !important; }
      .d-heading { color: #F0EBDD !important; }
      .d-card    { background-color: #0C1620 !important; border-color: #1C2F3E !important; }
      .d-name    { color: #E0B562 !important; }
      .d-desc    { color: #A9B7C4 !important; }
      .d-price   { color: #D9A44A !important; border-color: #33475A !important; }
      .d-cta     { background-color: #0C1620 !important; border-color: #D9A44A !important; }
      .d-ctatext { color: #F0EBDD !important; }
      .d-ctakicker { color: #D9A44A !important; }
      .d-hairline{ border-top-color: #1C2F3E !important; }
      .d-gold    { color: #D9A44A !important; }
    }

    @media only screen and (max-width: 520px) {
      .gutter { padding-left: 22px !important; padding-right: 22px !important; }
      .lead { font-size: 19px !important; }
    }
  </style>
</head>
<body class="d-body" style="margin:0;padding:0;background-color:#F5F8FB;" data-ogsc="#04070A" data-ogsb="#F5F8FB">
  <center role="presentation" style="width:100%;background-color:#F5F8FB;" class="d-body">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" class="d-body" style="max-width:640px;margin:0 auto;background-color:#F5F8FB;">
      <tr>
        <td class="d-body" style="padding:20px 12px;background-color:#F5F8FB;">
          <table class="shell d-shell" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;margin:0 auto;background-color:#EBF2F8;border:1px solid #D0DDE9;border-radius:16px;overflow:hidden;">

            <!-- Testata: carta intestata, nessun blocco colore -->
            <tr>
              <td class="gutter" style="padding:34px 36px 24px;text-align:center;">
                <table class="hairline-frame" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td width="26%" style="line-height:0;font-size:0;">
                      <div style="height:1px;background-image:linear-gradient(90deg,rgba(181,128,38,0) 0%,rgba(181,128,38,0.8) 100%);"></div>
                    </td>
                    <td style="white-space:nowrap;padding:0 14px;">
                      <div class="d-heading" style="font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:2px;color:#221D0F;line-height:1.2;text-align:center;">Νόστος&middot;Ξενία</div>
                    </td>
                    <td width="26%" style="line-height:0;font-size:0;">
                      <div style="height:1px;background-image:linear-gradient(90deg,rgba(181,128,38,0.8) 0%,rgba(181,128,38,0) 100%);"></div>
                    </td>
                  </tr>
                </table>
                <div class="d-muted" style="font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#4E6071;margin-top:12px;text-align:center;">viaggi autentici, lontano dal turismo di massa</div>
              </td>
            </tr>

            <tr>
              <td class="gutter" style="padding:0 36px;">
                <div class="d-hairline" style="border-top:1px solid #D0DDE9;line-height:1px;font-size:0;">&nbsp;</div>
              </td>
            </tr>

            <!-- Apertura -->
            <tr>
              <td class="gutter" style="padding:32px 36px 0;">
                <div class="d-lead lead" style="font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:500;font-style:italic;line-height:1.55;color:#221D0F;">$opening</div>
                <div class="d-muted" style="font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.7;color:#3B4956;margin-top:18px;">$understanding</div>
              </td>
            </tr>

            <!-- Selezione -->
            <tr>
              <td class="gutter" style="padding:40px 36px 0;">
                <div class="d-heading" style="font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;color:#221D0F;line-height:1.4;">Ecco i punti di partenza</div>
                <div class="d-hairline" style="border-top:1px solid #D0DDE9;margin-top:18px;line-height:1px;font-size:0;">&nbsp;</div>
              </td>
            </tr>

            <!-- Risorse -->
            <tr>
              <td class="gutter" style="padding:24px 36px 0;">
                $resource_groups
              </td>
            </tr>

            <!-- Fonti esplorate -->
            <tr>
              <td class="gutter" style="padding:20px 36px 0;">
                $appendix
              </td>
            </tr>

            <!-- CTA: cornice dorata, non blocco pieno -->
            <tr>
              <td class="gutter" style="padding:34px 36px 0;">
                <table class="cta-frame" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td class="d-cta" style="background-color:#EBF2F8;border:1px solid #B58026;border-radius:14px;padding:26px 30px;">
                      <div class="d-ctakicker" style="font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:#B58026;text-align:center;">Il prossimo passo</div>
                      <div class="d-ctatext" style="font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:500;font-style:italic;line-height:1.6;color:#221D0F;text-align:center;margin-top:10px;">$cta</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Firma -->
            <tr>
              <td class="gutter" style="padding:32px 36px 0;">
                <div class="d-bodytext" style="font-family:'Fraunces',Georgia,serif;font-size:15px;color:#221D0F;">$signature_greeting</div>
                <div class="d-bodytext" style="font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:600;color:#221D0F;margin-top:8px;">$signature_name</div>
                <div class="d-muted" style="font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:12px;color:#4E6071;margin-top:6px;letter-spacing:0.3px;">$signature_role</div>
              </td>
            </tr>

            <!-- Nota discreta: centrata, tono sommesso -->
            <tr>
              <td class="gutter" style="padding:26px 36px 0;text-align:center;">
                <div class="d-muted" style="font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-style:italic;line-height:1.6;color:#7A8895;text-align:center;">$honest_note</div>
              </td>
            </tr>

            <!-- Footer: stesso foglio, chiusura con filetto e monogramma -->
            <tr>
              <td class="gutter" style="padding:26px 36px 30px;text-align:center;">
                <div class="d-hairline" style="border-top:1px solid #D0DDE9;line-height:1px;font-size:0;margin-bottom:18px;">&nbsp;</div>
                <div class="d-gold" style="font-family:'Fraunces',Georgia,serif;font-size:13px;font-style:italic;color:#B58026;letter-spacing:0.5px;">Nostos &middot; viaggi su misura</div>
                <div style="margin-top:8px;">
                  <a href="https://xen-ia.github.io/nostos" target="_blank" class="d-muted" style="font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:0.5px;color:#4E6071;text-decoration:underline;">xen-ia.github.io/nostos</a>
                </div>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
