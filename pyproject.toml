[project]
name = "nostos"
version = "0.1.0"
description = "νόστος-ξενία"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.0.0",
    "fastapi>=0.139.2",
    "ollama>=0.6.2",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "resend>=2.35.0",
    "rich>=15.0.0",
    "serpapi>=1.0.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
